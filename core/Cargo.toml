[package]
name = "pillbox"
version = "0.15.4"
edition = "2021"

[[bin]]
name = "pillbox"
path = "src/main.rs"

[dependencies]
# DB
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
# r2d2_sqlite 0.25 es el matching para rusqlite 0.32 (0.24 era para rusqlite 0.31).
r2d2_sqlite = "0.25"
# Cache LRU para `AppState.bottle_pools` — cap el número de pools por-bottle
# vivos para que `serve` no acumule conexiones indefinidamente.
lru = "0.12"

# Serialización
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUIDs v7 para sync_id
uuid = { version = "1", features = ["v7"] }

# Validaciones de structs
validator = { version = "0.18", features = ["derive"] }

# Normalización unicode (NFD→NFC, acentos)
unicode-normalization = "0.1"

# Rutas multiplataforma (~/.pillbox)
dirs = "5"

# CLI
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
indicatif = "0.17"
tabled = { version = "0.17", features = ["ansi"] }
owo-colors = "4"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime (necesario para `pillbox serve`)
tokio = { version = "1", features = ["full"] }

# Service manager multiplataforma (systemd / launchd / sc)
service-manager = "0.7"

# HTTP server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# Descargas HTTP (install mcp/skill desde GitHub)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1"
tar = "0.4"

# WebUI embebida
rust-embed = { version = "8", features = ["mime-guess", "include-exclude", "compression"] }

# i18n
rust-i18n = "4"
sys-locale = "0.3"

# Fuzzy search
strsim = "0.11"
rayon = "1"

# Multiline strings con indentación limpia
indoc = "2"

# Directorios temporales (descarga e instalación de repos)
tempfile = "3"

# Detección de privilegios de Administrador (sólo Windows)
[target.'cfg(windows)'.dependencies]
is_elevated = "0.1"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true

[dev-dependencies]
