[package]
name = "pillbox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pillbox"
path = "src/main.rs"

[dependencies]
# DB
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialización
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUIDs v7 para sync_id
uuid = { version = "1", features = ["v7"] }

# Validaciones de structs
validator = { version = "0.18", features = ["derive"] }

# Normalización unicode (NFD→NFC, acentos)
unicode-normalization = "0.1"

# Rutas multiplataforma (~/.pillbox)
dirs = "5"

# CLI
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
indicatif = "0.17"
tabled = { version = "0.17", features = ["ansi"] }
owo-colors = "4"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime (necesario para `pillbox serve`)
tokio = { version = "1", features = ["full"] }

# mDNS — descubrimiento de red local
mdns-sd = "0.11"

# HTTP server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# WebUI embebida
rust-embed = { version = "8", features = ["mime-guess"] }

# i18n
rust-i18n = "4"
sys-locale = "0.3"

[profile.release]
opt-level     = 3
lto           = "thin"   # balance: protección + velocidad de compilación
codegen-units = 1
panic         = "abort"
strip         = true

[dev-dependencies]
tempfile = "3"
