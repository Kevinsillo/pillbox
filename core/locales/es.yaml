    prescriptions: "Prescriptions: "
    rx: "Rx: "
  server:
    running: "en ejecución — http://localhost:%{port}"
    stopped: "no está en ejecución"
  component:
    missing: "no instalado"
    estado: "Estado"

serve:
  title: "Servidor Web"
  running: "en ejecución"
  stopped: "detenido"
  daemon_started: "Servidor iniciado en segundo plano (PID %{pid}, puerto %{port})."
  labels:
    url: "URL"
    pid: "PID"
    estado: "Estado"
  inline:
    running: "en ejecución — http://localhost:%{port}  (PID %{pid})"
    stopped: "detenido — http://localhost:%{port}"
  error:
    already_running: "El servidor ya está en ejecución (PID %{pid})."
    no_db: "no se encontró ninguna DB de Pillbox"
  stop:
    none: "No hay ningún servidor en ejecución."
    dead: "No hay ningún servidor en ejecución (PID %{pid} no existe)."
    done: "Servidor detenido (PID %{pid})."

db:
  not_found: "No se encontró ninguna Pillbox. Ejecuta el script de instalación."
  open_not_found: "No se encontró ninguna DB de Pillbox.\nEjecuta 'pillbox bottle init' para crear una."

pills:
  none: "(ninguna)"
  list:
    title: "Pills de '%{bottle}'"
    col:
      num: "#"
      compound: "Compound"
      title: "Título"

prescriptions:
  none: "(ninguna)"
  state:
    open: "abierta"
    closed: "cerrada"
  list:
    title: "Prescriptions de '%{bottle}' (últimas %{limit})"
    col:
      id: "ID"
      title: "Título"
      state: "Estado"
  msg:
    opened: "Prescripción abierta: \"%{title}\""
    opened_id: "ID: "
    closed: "Prescripción cerrada: \"%{title}\""
  error:
    already_open: "Ya hay una prescripción abierta: \"%{title}\" (%{pills} pills, id=%{id}).\nCiérrala con 'pillbox prescription close' antes de abrir una nueva."
