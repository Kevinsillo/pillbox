    not_found: "No hay ningún bottle para este directorio.\nEjecuta 'pillbox bottle init' para crear uno."
    not_found_short: "No hay ningún bottle para este directorio."

status:
  title: "Pillbox Status"
  bin_unknown: "(desconocido)"
