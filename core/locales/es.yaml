      num: "#"
      name: "Nombre"
      display: "Display"
      dir: "Directorio"

bottle:
  status:
    labels:
      bottle: "Bottle"
      scope: "Scope"
      dir: "Directorio"
      pills: "Pills"
      rx: "Rx"
    rx_none: "ninguna abierta"
    rx_open: "\"%{title}\" (abierta, id=%{id})"
  init:
    start: "Inicializando bottle en %{dir}..."
    name_prompt: "¿Cómo quieres llamar a este proyecto?"
    scope:
      prompt: "¿Dónde guardar las memories?"
      local: "local  — .pillbox/pillbox.db (solo este proyecto)"
