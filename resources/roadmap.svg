<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1945" width="720"
     font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
     shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <defs>
    <style>
      /* ── Dark mode (default) ── */
      .bg       { fill: #0a0a0a; }
      .text     { fill: #f0f0f0; }
      .sub      { fill: #888888; }
      .dim      { fill: #666666; }
      .h-line   { stroke: #222222; fill: none; stroke-width: 1; }
      .tl-line  { stroke: #222222; fill: none; stroke-width: 1; }
      .logo-s   { stroke: #f0f0f0; }
      .logo-top { fill: #f0f0f0; }

      .tag-d    { fill: transparent; stroke: #2a2a2a; stroke-width: 1; }
      .tag-dt   { fill: #666666; }
      .tag-a    { fill: rgba(232,65,42,0.15); stroke: rgba(232,65,42,0.3); stroke-width: 1; }
      .tag-at   { fill: #e8412a; }
      .tag-p    { fill: transparent; stroke: #222222; stroke-width: 1; }
      .tag-pt   { fill: #888888; }
      .tag-l    { fill: rgba(240,240,240,0.08); stroke: rgba(240,240,240,0.15); stroke-width: 1; }
      .tag-lt   { fill: #f0f0f0; }
      .tag-f    { fill: transparent; stroke: #222222; stroke-width: 1; }
      .tag-ft   { fill: #666666; }

      .dot-d    { fill: #1a1a1a; stroke: #2a2a2a; stroke-width: 1; }
      .dot-a    { fill: #e8412a; stroke: #e8412a; stroke-width: 1; }
      .dot-p    { fill: #141414; stroke: #444444; stroke-width: 1; }
      .dot-l    { fill: #aaaaaa; stroke: #aaaaaa; stroke-width: 1; }
      .dot-f    { fill: #141414; stroke: #222222; stroke-width: 1; }
      .item-dot { fill: #444444; }
      .code     { fill: #cccccc; font-family: 'SF Mono','Fira Code','Consolas',monospace; font-size: 11.5px; }

      /* ── Light mode ── */
      @media (prefers-color-scheme: light) {
        .bg       { fill: #fafafa; }
        .text     { fill: #18181b; }
        .sub      { fill: #71717a; }
        .dim      { fill: #a1a1aa; }
        .h-line   { stroke: #e4e4e7; fill: none; stroke-width: 1; }
        .tl-line  { stroke: #d4d4d8; fill: none; stroke-width: 1; }
        .logo-s   { stroke: #18181b; }
        .logo-top { fill: #18181b; }

        .tag-d    { fill: transparent; stroke: #e4e4e7; stroke-width: 1; }
        .tag-dt   { fill: #a1a1aa; }
        .tag-a    { fill: rgba(232,65,42,0.1); stroke: rgba(232,65,42,0.3); stroke-width: 1; }
        .tag-at   { fill: #c73520; }
        .tag-p    { fill: transparent; stroke: #d4d4d8; stroke-width: 1; }
        .tag-pt   { fill: #71717a; }
        .tag-l    { fill: #f4f4f5; stroke: #d4d4d8; stroke-width: 1; }
        .tag-lt   { fill: #18181b; }
        .tag-f    { fill: transparent; stroke: #d4d4d8; stroke-width: 1; }
        .tag-ft   { fill: #a1a1aa; }

        .dot-d    { fill: #f4f4f5; stroke: #d4d4d8; stroke-width: 1; }
        .dot-a    { fill: #e8412a; stroke: #e8412a; stroke-width: 1; }
        .dot-p    { fill: #fafafa; stroke: #a1a1aa; stroke-width: 1; }
        .dot-l    { fill: #71717a; stroke: #71717a; stroke-width: 1; }
        .dot-f    { fill: #fafafa; stroke: #d4d4d8; stroke-width: 1; }
        .item-dot { fill: #a1a1aa; }
        .code     { fill: #52525b; }
      }
    </style>

    <clipPath id="logo-pill">
      <!-- clip rect in SVG space: original (22,18,20,28,rx10) scaled 0.5 + translate(24,24) -->
      <rect x="35" y="33" width="10" height="14" rx="5"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <!-- <rect width="720" height="1945" class="bg"/> -->

  <!-- ── Header ────────────────────────────────────── -->
  <!-- Logo (64x64 original scaled 0.5, placed at 24,24) -->
  <path d="M32,31 L28,31 L28,49 L32,49" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" class="logo-s"/>
  <path d="M48,31 L52,31 L52,49 L48,49" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" class="logo-s"/>
  <g clip-path="url(#logo-pill)">
    <rect x="35" y="33" width="10" height="7"  class="logo-top"/>
    <rect x="35" y="40" width="10" height="7"  fill="#e8412a"/>
  </g>

  <text x="70" y="41" font-size="18" font-weight="600" class="text">Pillbox</text>
  <text x="70" y="59" font-size="13" class="sub">Persistent memory for AI coding agents</text>
  <!-- <text x="696" y="41" font-size="12" text-anchor="end" class="sub">Current <tspan font-weight="600" class="text">v0.10.0</tspan></text> -->

  <line x1="24" y1="90" x2="696" y2="90" class="h-line"/>

  <!-- ── Roadmap title ─────────────────────────────── -->
  <text x="24" y="130" font-size="28" font-weight="700" letter-spacing="-0.5" class="text">Roadmap</text>

  <!-- ── Timeline vertical line (first dot → last dot) -->
  <line x1="136" y1="195" x2="136" y2="1695" class="tl-line"/>

  <!-- ════════════════════════════════════════════════ -->
  <!--  RELEASED                                        -->
  <!-- ════════════════════════════════════════════════ -->
  <text x="24" y="157" font-size="10" font-weight="600" letter-spacing="1.2" class="dim">RELEASED</text>

  <!-- v0.4 · y=175 ··································· -->
  <rect x="66" y="188" width="46" height="22" rx="4" class="tag-d"/>
  <text x="89"  y="204" font-size="11" font-weight="700" letter-spacing="0.8" text-anchor="middle" class="tag-dt">v0.4</text>
  <text x="112" y="224" font-size="10" text-anchor="end" class="dim">Foundations</text>
  <circle cx="136" cy="195" r="5" class="dot-d"/>
  <text x="156" y="203" font-size="14" font-weight="600" class="text">Core architecture</text>
  <text x="156" y="221" font-size="12" class="sub">REST API, unified CLI output, UUID-based bottles, multi-language support</text>
  <text x="156" y="237" font-size="12" class="sub">and full test coverage.</text>

  <!-- v0.5 · y=275 ··································· -->
  <rect x="66" y="288" width="46" height="22" rx="4" class="tag-d"/>
  <text x="89"  y="304" font-size="11" font-weight="700" letter-spacing="0.8" text-anchor="middle" class="tag-dt">v0.5</text>
  <text x="112" y="324" font-size="10" text-anchor="end" class="dim">Web UI</text>
  <circle cx="136" cy="295" r="5" class="dot-d"/>
  <text x="156" y="303" font-size="14" font-weight="600" class="text">Light &amp; dark theme</text>
  <text x="156" y="321" font-size="12" class="sub">Full light/dark mode support across the web UI.</text>

  <!-- v0.6 · y=360 ··································· -->
  <rect x="66" y="373" width="46" height="22" rx="4" class="tag-d"/>
  <text x="89"  y="389" font-size="11" font-weight="700" letter-spacing="0.8" text-anchor="middle" class="tag-dt">v0.6</text>
  <text x="112" y="409" font-size="10" text-anchor="end" class="dim">Stats</text>
  <circle cx="136" cy="380" r="5" class="dot-d"/>
  <text x="156" y="388" font-size="14" font-weight="600" class="text">Statistics &amp; bottle actions</text>
  <text x="156" y="406" font-size="12" class="sub">Activity chart, bottle stats endpoint, delete and repair CLI commands,</text>
  <text x="156" y="422" font-size="12" class="sub">redesigned status indicators.</text>

  <!-- v0.7 · y=460 ··································· -->
  <rect x="66" y="473" width="46" height="22" rx="4" class="tag-d"/>
  <text x="89"  y="489" font-size="11" font-weight="700" letter-spacing="0.8" text-anchor="middle" class="tag-dt">v0.7</text>
  <text x="112" y="509" font-size="10" text-anchor="end" class="dim">Data mgmt</text>
  <circle cx="136" cy="480" r="5" class="dot-d"/>
  <text x="156" y="488" font-size="14" font-weight="600" class="text">Soft &amp; hard delete</text>
  <text x="156" y="506" font-size="12" class="sub">Archive and permanently delete capsules; double-action confirmation modal</text>
  <text x="156" y="522" font-size="12" class="sub">for destructive operations.</text>

  <!-- v0.8 · y=560 ··································· -->
  <rect x="66" y="573" width="46" height="22" rx="4" class="tag-d"/>
  <text x="89"  y="589" font-size="11" font-weight="700" letter-spacing="0.8" text-anchor="middle" class="tag-dt">v0.8</text>
  <text x="112" y="609" font-size="10" text-anchor="end" class="dim">MCP</text>
  <circle cx="136" cy="580" r="5" class="dot-d"/>
  <text x="156" y="588" font-size="14" font-weight="600" class="text">MCP tool refinement</text>
  <text x="156" y="606" font-size="12" class="sub">MCP tool renames for consistency; richer tool results with title, compound</text>
  <text x="156" y="622" font-size="12" class="sub">and content.</text>

  <!-- v0.9 · y=660 ··································· -->
  <rect x="62" y="673" width="50" height="22" rx="4" class="tag-d"/>
  <text x="87"  y="689" font-size="11" font-weight="700" letter-spacing="0.8" text-anchor="middle" class="tag-dt">v0.9</text>
  <text x="112" y="709" font-size="10" text-anchor="end" class="dim">Identity</text>
  <circle cx="136" cy="680" r="5" class="dot-d"/>
  <text x="156" y="688" font-size="14" font-weight="600" class="text">Authorship &amp; multi-user</text>
  <text x="156" y="706" font-size="12" class="sub">Author name/email on prescriptions, bottle vinculate for multi-user bottles,</text>
  <text x="156" y="722" font-size="12" class="sub">OS-native system service.</text>

  <!-- v0.10 · y=760 ·································· -->
  <rect x="58" y="773" width="54" height="22" rx="4" class="tag-d"/>
  <text x="85"  y="789" font-size="11" font-weight="700" letter-spacing="0.8" text-anchor="middle" class="tag-dt">v0.10</text>
  <text x="112" y="809" font-size="10" text-anchor="end" class="dim">Real-time</text>
  <circle cx="136" cy="780" r="5" class="dot-d"/>
  <text x="156" y="788" font-size="14" font-weight="600" class="text">Real-time &amp; paginated lists</text>
  <text x="156" y="806" font-size="12" class="sub">Live polling in the web UI, paginated CLI listings and animated list transitions.</text>

  <!-- ════════════════════════════════════════════════ -->
  <!--  UPCOMING                                        -->
  <!-- ════════════════════════════════════════════════ -->
  <line x1="24" y1="845" x2="696" y2="845" class="h-line"/>
  <text x="24" y="885" font-size="10" font-weight="600" letter-spacing="1.2" class="dim">UPCOMING</text>

  <!-- v0.11 · y=900 ·································· -->
  <rect x="58" y="913" width="54" height="22" rx="4" class="tag-a"/>
  <text x="85"  y="929" font-size="11" font-weight="700" letter-spacing="0.8" text-anchor="middle" class="tag-at">v0.11</text>
  <text x="112" y="949" font-size="10" text-anchor="end" class="dim">UI &amp; UX</text>
  <circle cx="136" cy="920" r="5" class="dot-a"/>
  <text x="156" y="928" font-size="14" font-weight="600" class="text">Polish &amp; quick wins</text>
  <text x="156" y="946" font-size="12" class="sub">Visible improvements to the CLI output and UX.</text>
  <circle cx="163" cy="963" r="2" class="item-dot"/>
  <text x="173" y="967" font-size="13" class="sub">Archived records always shown last in CLI listings — limit count per section</text>
  <circle cx="163" cy="985" r="2" class="item-dot"/>
  <text x="173" y="989" font-size="13" class="sub">Improved prescription open/closed visual design</text>
  <circle cx="163" cy="1007" r="2" class="item-dot"/>
  <text x="173" y="1011" font-size="13" class="sub">MCP output shows title + content on <tspan class="code">pill_store</tspan> / <tspan class="code">pill_revise</tspan></text>

  <!-- v0.12 · y=1064 ································· -->
  <rect x="58" y="1077" width="54" height="22" rx="4" class="tag-p"/>
  <text x="85"  y="1093" font-size="11" font-weight="700" letter-spacing="0.8" text-anchor="middle" class="tag-pt">v0.12</text>
  <text x="112" y="1113" font-size="10" text-anchor="end" class="dim">Architecture</text>
  <circle cx="136" cy="1084" r="5" class="dot-p"/>
  <text x="156" y="1092" font-size="14" font-weight="600" class="text">Data model consolidation</text>
  <text x="156" y="1110" font-size="12" class="sub">Cleanups that improve consistency and enable future multi-device sync.</text>
  <circle cx="163" cy="1127" r="2" class="item-dot"/>
  <text x="173" y="1131" font-size="13" class="sub">Drop all auto-increment IDs — use only UUIDs everywhere</text>
  <circle cx="163" cy="1149" r="2" class="item-dot"/>
  <text x="173" y="1153" font-size="13" class="sub">Separate local and global database schemas</text>
  <circle cx="163" cy="1171" r="2" class="item-dot"/>
  <text x="173" y="1175" font-size="13" class="sub">Pause prescription with status &amp; message (technical debt tracking)</text>
  <circle cx="163" cy="1193" r="2" class="item-dot"/>
  <text x="173" y="1197" font-size="13" class="sub">Short UUID prefixes in web UI URLs</text>
  <circle cx="163" cy="1215" r="2" class="item-dot"/>
  <text x="173" y="1219" font-size="13" class="sub">Delete database when last bottle is removed</text>

  <!-- v0.13 · y=1272 ································· -->
  <rect x="58" y="1285" width="54" height="22" rx="4" class="tag-p"/>
  <text x="85"  y="1301" font-size="11" font-weight="700" letter-spacing="0.8" text-anchor="middle" class="tag-pt">v0.13</text>
  <text x="112" y="1321" font-size="10" text-anchor="end" class="dim">Platform</text>
  <circle cx="136" cy="1292" r="5" class="dot-p"/>
  <text x="156" y="1300" font-size="14" font-weight="600" class="text">Multi-platform &amp; distribution</text>
  <text x="156" y="1318" font-size="12" class="sub">Windows support and streamlined install across AI providers.</text>
  <circle cx="163" cy="1335" r="2" class="item-dot"/>
  <text x="173" y="1339" font-size="13" class="sub"><tspan class="code">pillbox skills install</tspan> — downloads and runs install.sh from the skills repo</text>
  <circle cx="163" cy="1357" r="2" class="item-dot"/>
  <text x="173" y="1361" font-size="13" class="sub">SDD skill + agents offered during installation (recommended vs. advanced)</text>
  <circle cx="163" cy="1379" r="2" class="item-dot"/>
  <text x="173" y="1383" font-size="13" class="sub">Windows support (install.ps1, MSVC targets, elevated permissions)</text>
  <circle cx="163" cy="1401" r="2" class="item-dot"/>
  <text x="173" y="1405" font-size="13" class="sub">More languages in Astro Starlight docs</text>
  <circle cx="163" cy="1423" r="2" class="item-dot"/>
  <text x="173" y="1427" font-size="13" class="sub">Document that mcp/skills install downloads from official repositories</text>

  <!-- ════════════════════════════════════════════════ -->
  <!--  LAUNCH                                          -->
  <!-- ════════════════════════════════════════════════ -->
  <line x1="24" y1="1480" x2="696" y2="1480" class="h-line"/>
  <text x="24" y="1520" font-size="10" font-weight="600" letter-spacing="1.2" class="dim">LAUNCH</text>

  <!-- v1.0 · y=1535 ·································· -->
  <rect x="66" y="1548" width="46" height="22" rx="4" class="tag-l"/>
  <text x="89"  y="1564" font-size="11" font-weight="700" letter-spacing="0.8" text-anchor="middle" class="tag-lt">v1.0</text>
  <text x="112" y="1584" font-size="10" text-anchor="end" class="dim">Public release</text>
  <circle cx="136" cy="1555" r="5" class="dot-l"/>
  <text x="156" y="1563" font-size="14" font-weight="600" class="text">Public release</text>
  <text x="156" y="1581" font-size="12" class="sub">Open the project to the world once all prior milestones are complete.</text>

  <!-- ════════════════════════════════════════════════ -->
  <!--  AFTER LAUNCH                                    -->
  <!-- ════════════════════════════════════════════════ -->
  <line x1="24" y1="1620" x2="696" y2="1620" class="h-line"/>
  <text x="24" y="1660" font-size="10" font-weight="600" letter-spacing="1.2" class="dim">AFTER LAUNCH</text>

  <!-- Post 1.0 · y=1675 ······························ -->
  <rect x="56" y="1688" width="56" height="22" rx="4" class="tag-f"/>
  <text x="84"  y="1704" font-size="11" font-weight="700" letter-spacing="0.8" text-anchor="middle" class="tag-ft">Post 1.0</text>
  <text x="112" y="1724" font-size="10" text-anchor="end" class="dim">Future</text>
  <circle cx="136" cy="1695" r="5" class="dot-f"/>
  <text x="156" y="1703" font-size="14" font-weight="600" class="text">After launch</text>
  <text x="156" y="1721" font-size="12" class="sub">Ideas for after the public release.</text>
  <circle cx="163" cy="1738" r="2" class="item-dot"/>
  <text x="173" y="1742" font-size="13" class="sub">Work on multiple prescriptions simultaneously</text>
  <circle cx="163" cy="1760" r="2" class="item-dot"/>
  <text x="173" y="1764" font-size="13" class="sub">Real-time dashboard via WebSocket</text>
  <circle cx="163" cy="1782" r="2" class="item-dot"/>
  <text x="173" y="1786" font-size="13" class="sub">Dashboard statistics improvements</text>
  <circle cx="163" cy="1804" r="2" class="item-dot"/>
  <text x="173" y="1808" font-size="13" class="sub">Own SVG icons for pills, capsules, prescriptions, bottles</text>
  <circle cx="163" cy="1826" r="2" class="item-dot"/>
  <text x="173" y="1830" font-size="13" class="sub">Archived pills shown with zebra-stripe pattern in web UI</text>
  <circle cx="163" cy="1848" r="2" class="item-dot"/>
  <text x="173" y="1852" font-size="13" class="sub">More AI provider integrations</text>

</svg>
