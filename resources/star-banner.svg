<svg width="780" height="90" viewBox="0 0 780 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg   { fill: url(#bg-light); }
      .text-main { fill: #18181b; }
      .text-sub  { fill: #52525b; }
      .arrow     { fill: #a1a1aa; }

      @media (prefers-color-scheme: dark) {
        .bg        { fill: url(#bg-dark); }
        .text-main { fill: #f4f4f5; }
        .text-sub  { fill: #71717a; }
        .arrow     { fill: #52525b; }
      }
    </style>

    <linearGradient id="bg-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="star-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background with transparent corners -->
  <rect width="780" height="90" rx="10" class="bg"/>

  <!-- Star icon -->
  <g transform="translate(24, 31) scale(1.1)">
    <path d="M12 2l2.75 5.57 6.15.89-4.45 4.33 1.05 6.11L12 15.93l-5.5 2.97 1.05-6.11L3.1 8.46l6.15-.89z"
          fill="url(#star-fill)"/>
  </g>

  <!-- Main text -->
  <text x="54" y="38"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="15" font-weight="600" class="text-main">
    If you find Pillbox useful, star it on GitHub
  </text>

  <!-- Subtext -->
  <text x="54" y="60"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="12.5" class="text-sub">
    It only takes a second and helps the project reach more developers
  </text>

  <!-- Arrow -->
  <text x="758" y="50"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="24" text-anchor="middle" class="arrow">›</text>
</svg>
