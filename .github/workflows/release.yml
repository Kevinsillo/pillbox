name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Crea la release vacía inmediatamente ─────────────────────────────────────
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git cliff --latest --strip all -o release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── Compila y sube cada binario en cuanto está listo ─────────────────────────
  build:
    name: ${{ matrix.artifact }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: pillbox-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: pillbox-linux-aarch64
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pillbox-darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: pillbox-darwin-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pillbox-windows-x86_64.exe
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: pillbox-windows-aarch64.exe
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── WebUI ────────────────────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: latest
          package_json_file: webui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Build WebUI
        run: pnpm install && pnpm build
        working-directory: webui

      # ── Rust ─────────────────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> core/target
          key: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        if: matrix.use_cross != true
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: core

      - name: Build (cross)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }} --manifest-path core/Cargo.toml

      # ── Subir binario a la release en cuanto está listo ──────────────────────
      - name: Rename binary (Unix)
        if: matrix.ext != '.exe'
        run: cp core/target/${{ matrix.target }}/release/pillbox ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: matrix.ext == '.exe'
        run: Copy-Item core/target/${{ matrix.target }}/release/pillbox.exe ${{ matrix.artifact }}
        shell: pwsh

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}

  # ── Genera SHA256SUMS cuando todos los binarios están subidos ────────────────
  finalize:
    name: Finalize release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        run: gh release download ${{ github.ref_name }} --dir artifacts/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate SHA256SUMS
        run: cd artifacts && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SHA256SUMS.txt
